<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#090b0f" />
    <title>VPS Agent · 离线</title>
    <style>
      :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b0f;color:#f4f7f8;font-family:Arial,sans-serif}.card{box-sizing:border-box;width:min(440px,calc(100% - 32px));padding:28px;border:1px solid #252d38;border-radius:16px;background:#11161d}.status{color:#ff7b7b;font:600 11px monospace;letter-spacing:.12em}.status:before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:currentColor}h1{margin:22px 0 12px;font-size:34px}p{color:#8b97a7;line-height:1.65}button{min-height:44px;border:1px solid #4b8b68;border-radius:8px;background:#183526;color:#78f0ad;padding:10px 16px;font-weight:600}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="status">OFFLINE</div>
      <h1>当前没有网络连接</h1>
      <p>为避免展示过期的运维状态，控制台不会离线保存机器、事件、诊断或操作数据。恢复网络后请重新加载。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
