name: Control Plane Recovery

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned age toolchain
        run: sudo sh deploy/install-age.sh
      - name: Run real PostgreSQL backup and isolated restore
        env:
          DR_AGE_BINARY: /opt/vps-agent/tools/age/1.3.1/age
        run: sh deploy/tests/m6-recovery-integration.sh

  release-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run release-only image-pull integration
        run: sh deploy/tests/m6-release-integration.sh
