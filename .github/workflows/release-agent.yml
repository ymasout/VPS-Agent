name: Agent Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Review-only SemVer from release/release.json
        required: true
        default: "0.6.3"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.mod
      - name: Validate frozen release coordinates
        run: python3 scripts/release.py check --version "${{ inputs.version }}"
      - name: Test Agent
        working-directory: apps/agent
        run: go test ./... && go vet ./...
      - name: Build Linux binary
        working-directory: apps/agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ../../dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION#v}" \
            -o "../../dist/vps-agent-linux-${GOARCH}" ./cmd/agent
          test "$(../../dist/vps-agent-linux-${GOARCH} --version)" = "vps-agent ${VERSION#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-candidate-${{ inputs.version }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 14
          path: dist/vps-agent-linux-${{ matrix.goarch }}
