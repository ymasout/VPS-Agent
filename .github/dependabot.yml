version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      actions-non-major:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      python-non-major:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      root-node-non-major:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      web-node-non-major:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /apps/agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      go-non-major:
        update-types: [minor, patch]
